<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lección — DevPath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
.attrs{display:flex;flex-direction:column;gap:10px}
.attrs .tbl{border:1px solid var(--line);border-radius:14px;overflow:auto}
.attrs table{width:100%;border-collapse:collapse;font-size:14px}
.attrs th{background:var(--bg);text-align:left;padding:10px 14px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.attrs td{padding:10px 14px;border-top:1px solid #F0F0F5;line-height:1.55;vertical-align:top;color:#374151}
.attrs td:first-child{white-space:nowrap}.attrs td code{color:#3730A3;font-size:13px}
.warn{border:1px solid #FECACA;background:#FEF2F2;border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.6;color:#7F1D1D}
.code.live textarea{display:block;width:100%;box-sizing:border-box;border:0;resize:vertical;background:var(--dark);color:#E5E7F5;padding:16px 18px;font-size:14px;line-height:1.75;outline:none;tab-size:2}
.code.live textarea:focus-visible{box-shadow:inset 0 0 0 2px #818CF8}
.code.live .reset{font:500 12px Inter;background:#262A4A;color:#E5E7F5;border:0;border-radius:8px;padding:6px 10px;cursor:pointer;min-height:32px}
.code.live .out{background:#fff;border-top:1px solid #262A4A}
.code.live .out span{display:block;padding:8px 16px;font-size:12px;font-weight:600;color:var(--muted);background:var(--bg)}
.code.live iframe{display:block;width:100%;height:220px;border:0;background:#fff}
.code.live .runb{background:#4F46E5}
.con{background:#0B0E23;color:#E5E7F5;font-size:13px;line-height:1.7;padding:12px 16px;min-height:60px;max-height:260px;overflow:auto;white-space:pre-wrap}
.con i{color:#A5A9C8}.con .err{color:#FCA5A5}.con .warn{color:#FDE68A}
.salida{border:1px solid var(--line);border-radius:14px;padding:12px 16px;background:#fff}
.salida summary{cursor:pointer;font-weight:600;font-size:14px;color:#4338CA}
.salida pre{margin:10px 0 0;background:#0B0E23;color:#E5E7F5;border-radius:10px;padding:12px 14px;font-size:13px;white-space:pre-wrap}
.mini{border:1px solid #C7D2FE;background:#EEF2FF;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.mini p{margin:0;line-height:1.5}.mopts{display:flex;flex-direction:column;gap:8px}.mfb{font-size:14px;color:#1E1B4B}
</style>
</head>
<body>
<header class="top"><div class="wrap" style="max-width:1240px">
<a href="/" id="back" class="btn" style="color:#374151;padding-left:0">← Volver</a>
<div class="row" style="flex:0 1 360px;flex-wrap:nowrap"><span id="count" style="font-size:13px;color:var(--muted);white-space:nowrap"></span><div class="prog" style="flex:1"><i id="bar"></i></div></div>
</div></header>
<div class="wrap lesson">
<nav class="card toc" aria-label="Capítulos y secciones">
<label for="cap" style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:0 8px">Capítulo</label>
<select id="cap" style="font:600 14px Inter,sans-serif;padding:10px 12px;border-radius:10px;border:1px solid #D1D5DB;background:#fff;min-height:44px;margin:4px 0 12px;width:100%"></select>
<h4 id="captitle"></h4>
<div id="toc"></div>
</nav>
<main class="card content" id="content"></main>
</div>
<footer><div class="wrap"><span>DevPath · Apuntes interactivos de la clase de DAW</span><a href="/" id="foot">Volver al tema</a></div></footer>
<script src="/data.js"></script>
<script src="/temas.js"></script>
<script src="/leccion.js"></script>
</body>
</html>
